services:
  dujiao-next:
    image: litehub/dujiao-next-erkai:latest
    container_name: dujiao-next
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./config.yml:/app/config.yml:ro
      - dujiaonext-uploads:/app/uploads
      - dujiaonext-logs:/app/logs
    networks:
      - dujiaonext-network
    depends_on:
      dujiaonext-postgres:
        condition: service_healthy
      dujiaonext-redis:
        condition: service_healthy

  dujiaonext-postgres:
    image: postgres:16-alpine
    container_name: dujiaonext-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: dujiao
      POSTGRES_PASSWORD: change-this-postgres-password
      POSTGRES_DB: dujiao
    volumes:
      - dujiaonext-postgres-data:/var/lib/postgresql/data
    networks:
      - dujiaonext-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dujiao -d dujiao"]
      interval: 5s
      timeout: 5s
      retries: 10

  dujiaonext-redis:
    image: redis:7-alpine
    container_name: dujiaonext-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - dujiaonext-redis-data:/data
    networks:
      - dujiaonext-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

networks:
  dujiaonext-network:
    name: dujiaonext-network

volumes:
  dujiaonext-postgres-data:
  dujiaonext-redis-data:
  dujiaonext-uploads:
  dujiaonext-logs:
